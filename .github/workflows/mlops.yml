name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "params.yaml"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

env:
  GCS_BUCKET: ${{ secrets.CLOUD_BUCKET }}
  EVAL_THRESHOLD: "0.70"
  LIVE_MODEL_KEY: models/latest/model.pkl
  LIVE_METRICS_KEY: metrics/latest/metrics.json
  LIVE_REPORT_KEY: reports/latest/report.txt
  CANDIDATE_MODEL_KEY: models/candidates/${{ github.sha }}/model.pkl
  CANDIDATE_METRICS_KEY: metrics/candidates/${{ github.sha }}.json
  CANDIDATE_REPORT_KEY: reports/candidates/${{ github.sha }}.txt

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      previous_accuracy: ${{ steps.previous_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure MLflow tracking
        run: |
          if [ -n "${{ secrets.MLFLOW_TRACKING_URI }}" ]; then
            echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV
            echo "MLFLOW_EXPERIMENT_NAME=wine-quality-ci" >> $GITHUB_ENV
            echo "Using remote MLflow tracking."
          else
            echo "MLFLOW_TRACKING_URI=sqlite:///mlflow.db" >> $GITHUB_ENV
            echo "MLFLOW_ARTIFACT_ROOT=./mlartifacts" >> $GITHUB_ENV
            echo "MLFLOW_EXPERIMENT_NAME=wine-quality-local" >> $GITHUB_ENV
            echo "Using local MLflow tracking."
          fi

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Read previous deployed metrics
        id: previous_metrics
        run: |
          python - <<'EOF'
          import json
          import os
          from google.cloud import storage

          client = storage.Client()
          blob = client.bucket(os.environ["GCS_BUCKET"]).blob(os.environ["LIVE_METRICS_KEY"])
          accuracy = ""

          if blob.exists():
              metrics = json.loads(blob.download_as_text())
              accuracy = str(metrics.get("accuracy", ""))
              print(f"Found previous deployed accuracy: {accuracy}")
          else:
              print("No previous deployed metrics found.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"accuracy={accuracy}\n")
          EOF

      - name: Upload candidate artifacts to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          client = storage.Client()
          bucket = client.bucket(os.environ["GCS_BUCKET"])

          uploads = [
              ("models/model.pkl", os.environ["CANDIDATE_MODEL_KEY"]),
              ("outputs/metrics.json", os.environ["CANDIDATE_METRICS_KEY"]),
              ("outputs/report.txt", os.environ["CANDIDATE_REPORT_KEY"]),
          ]

          for source_path, destination_key in uploads:
              blob = bucket.blob(destination_key)
              blob.upload_from_filename(source_path)
              print(
                  f"Uploaded {source_path} -> "
                  f"gs://{os.environ['GCS_BUCKET']}/{destination_key}"
              )
          EOF

      - name: Save training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            outputs/metrics.json
            outputs/report.txt

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        run: |
          python - <<'EOF'
          threshold = float("${{ env.EVAL_THRESHOLD }}")
          new_acc = float("${{ needs.train.outputs.accuracy }}")
          previous_raw = "${{ needs.train.outputs.previous_accuracy }}"

          print(f"Current candidate accuracy: {new_acc:.4f}")
          if new_acc < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {new_acc:.4f} < {threshold:.2f}. Huy deploy."
              )

          if previous_raw.strip():
              previous_acc = float(previous_raw)
              print(f"Previous deployed accuracy: {previous_acc:.4f}")
              if new_acc < previous_acc:
                  raise SystemExit(
                      f"FAILED: accuracy moi {new_acc:.4f} thap hon model dang chay "
                      f"{previous_acc:.4f}. Huy deploy de tranh rollback xau."
                  )
          else:
              print("Khong co metrics cua phien ban truoc. Bo qua rollback gate.")

          print("PASSED: model dat eval gate va rollback gate.")
          EOF

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deploy dependency
        run: pip install google-cloud-storage==2.16.0

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Promote candidate artifacts to live paths
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          client = storage.Client()
          bucket = client.bucket(os.environ["GCS_BUCKET"])

          promotions = [
              (os.environ["CANDIDATE_MODEL_KEY"], os.environ["LIVE_MODEL_KEY"]),
              (os.environ["CANDIDATE_METRICS_KEY"], os.environ["LIVE_METRICS_KEY"]),
              (os.environ["CANDIDATE_REPORT_KEY"], os.environ["LIVE_REPORT_KEY"]),
          ]

          for source_key, destination_key in promotions:
              source_blob = bucket.blob(source_key)
              if not source_blob.exists():
                  raise SystemExit(
                      f"Missing candidate artifact "
                      f"gs://{os.environ['GCS_BUCKET']}/{source_key}"
                  )
              bucket.copy_blob(source_blob, bucket, destination_key)
              print(
                  f"Promoted gs://{os.environ['GCS_BUCKET']}/{source_key} -> "
                  f"gs://{os.environ['GCS_BUCKET']}/{destination_key}"
              )
          EOF

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for attempt in 1 2 3 4 5; do
              echo "Health check attempt $attempt/5"
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 5 attempts."
            sudo journalctl -u mlops-serve -n 50 --no-pager || true
            exit 1
